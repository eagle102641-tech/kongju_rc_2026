<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>RC CAR Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>

<script src="{{ url_for('static',
filename='js/app.js') }}"></script>
<body>

<div class="container">

    <h1>🚗 RC CAR DASHBOARD</h1>

    <div class="top">

        <div class="camera">

            <h2>📷 Camera</h2>

            <div class="camera-box">

                Camera OFF

            </div>

        </div>

        <div class="status">

            <h2>📊 Status</h2>

            <p>🟢 Connected</p>

            <p>🔋 Battery :
                <span id="battery">100%</span>
            </p>

            <p>🚗 Speed :
                <span id="speedText">50%</span>
            </p>

            <p>🎮 Mode :
                Manual
            </p>

        </div>

    </div>


  <div class="control">

    <h2>Joystick</h2>

    <div id="joystick"></div>

</div>


    <div class="speed">

        <h2>Speed</h2>

        <input
                id="speedSlider"
                type="range"
                min="0"
                max="100"
                value="50">

    </div>


    <div class="log">

        <h2>LOG</h2>

        <div id="logBox">

            Dashboard Ready

        </div>

    </div>

</div>

<script src="{{ url_for('static',
filename='js/app.js') }}"></script>

</body>

</html>
